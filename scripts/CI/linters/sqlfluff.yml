sqlfluff:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install SQLFluff
      run: pip install sqlfluff==3.4.1

    - name: Run SQLFluff on SQL files
      run: bash scripts/shell/linters/sqlfluff.sh
