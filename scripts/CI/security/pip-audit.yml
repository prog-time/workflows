pip-audit:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: pip install pip-audit==2.7.3

    - name: Run pip-audit
      run: bash scripts/shell/security/pip-audit.sh
